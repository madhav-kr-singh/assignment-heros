openapi: 3.0.0
info:
  title: Digital Heroes CRM API
  description: API documentation for the Digital Heroes CRM & Lead Management System. All auth-protected endpoints require a valid session JWT token set in HttpOnly cookies (`auth_token`) or passed in the `Authorization: Bearer <token>` header.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /api/auth/login:
    post:
      summary: User Login
      description: Validates staff credentials and establishes a session. Sets a secure HttpOnly cookie containing the session JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@digitalheroes.com
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Authentication successful.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: auth_token=jwt_value; Path=/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 6a643fe9f2018b023fe97bb2
                      name:
                        type: string
                        example: Root Admin
                      email:
                        type: string
                        example: admin@digitalheroes.com
                      role:
                        type: string
                        enum: [admin, member]
                        example: admin
        '400':
          description: Input validation error.
        '401':
          description: Invalid email or password.

  /api/auth/logout:
    post:
      summary: User Logout
      description: Terminates current staff session by clearing the HttpOnly auth cookie.
      responses:
        '200':
          description: Logout successful.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: auth_token=; Path=/; Max-Age=0; HttpOnly

  /api/auth/me:
    get:
      summary: Current Session Profile
      description: Returns profile details of the currently logged-in user.
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 6a643fe9f2018b023fe97bb2
                      email:
                        type: string
                        example: admin@digitalheroes.com
                      role:
                        type: string
                        example: admin
                      name:
                        type: string
                        example: Root Admin
        '401':
          description: Unauthorized. Session is missing or invalid.

  /api/users:
    get:
      summary: List Staff Accounts (Admin Only)
      description: Returns a list of all registered portal users. Restricted to admin accounts.
      responses:
        '200':
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                          enum: [admin, member]
                        active:
                          type: boolean
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires admin role privileges.

    post:
      summary: Create Staff Account (Admin Only)
      description: Registers a new admin or member staff user. Restricted to admin accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  example: Jane Member
                email:
                  type: string
                  format: email
                  example: jane@digitalheroes.com
                password:
                  type: string
                  minLength: 6
                  example: member123
                role:
                  type: string
                  enum: [admin, member]
                  example: member
      responses:
        '201':
          description: User account created successfully.
        '400':
          description: Input validation error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires admin role.
        '409':
          description: Conflict. User account with this email already exists.

  /api/users/{id}:
    patch:
      summary: Update Staff Account (Admin Only)
      description: Toggles a staff account activation status (`active`) or updates their role. Features a safeguard preventing self-deactivation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [admin, member]
                active:
                  type: boolean
      responses:
        '200':
          description: Account updated successfully.
        '400':
          description: Input validation error or safeguard self-deactivation block.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires admin role.
        '404':
          description: User account not found.

  /api/leads:
    post:
      summary: Capture Lead (Public)
      description: Public endpoint to capture new inquires from the landing page. Logs capture action to activity logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Bob Customer
                email:
                  type: string
                  format: email
                  example: bob@customer.com
                phone:
                  type: string
                  example: "+1 555 987 6543"
                company:
                  type: string
                  example: Customer Inc
                source:
                  type: string
                  default: web
                  example: landing_page
      responses:
        '201':
          description: Lead captured successfully.
        '400':
          description: Input validation error.

    get:
      summary: List Leads
      description: Returns a list of leads with pagination, filters, and search. Admins see all leads; members only see leads assigned to them.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, proposal, won, lost]
        - name: assignedTo
          in: query
          schema:
            type: string
            description: Filter by user ID. Admins only; ignored for members.
        - name: search
          in: query
          schema:
            type: string
            description: Fuzzy search over name, email, and company fields.
      responses:
        '200':
          description: Leads retrieved successfully.
        '401':
          description: Unauthorized.

  /api/leads/{id}:
    get:
      summary: Get Lead Details
      description: Returns detail specifications of a lead. Scoped to assigned owner for members.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Details retrieved successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Lead is not assigned to current member.
        '404':
          description: Lead not found.

    patch:
      summary: Update Lead
      description: Modifies lead fields. Only admins can update the assignee. Validates pipeline status transitions. Logs all changes to Activity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                company:
                  type: string
                status:
                  type: string
                  enum: [new, contacted, qualified, proposal, won, lost]
                assignedTo:
                  type: string
                  nullable: true
                  description: User ID. Admin only.
      responses:
        '200':
          description: Lead updated successfully.
        '400':
          description: Validation error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Lead is not assigned to current member, or member attempts to assign lead.
        '404':
          description: Lead not found.
        '422':
          description: Unprocessable entity. Invalid status transition flow.

  /api/leads/{id}/notes:
    get:
      summary: List Lead Notes
      description: Returns discussion comments logged for a lead. Scoped by assignee for members.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notes retrieved successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Lead is not assigned to current member.

    post:
      summary: Add Lead Note
      description: Appends a note update to a lead. Logs note addition activity. Scoped by assignee for members.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  maxLength: 1000
                  example: "Contacted lead via email to schedule first presentation."
      responses:
        '201':
          description: Note saved successfully.
        '400':
          description: Input validation error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Lead is not assigned to current member.

  /api/leads/{id}/activity:
    get:
      summary: Get Lead Activity Log
      description: Returns the audit trail of modifications made to a lead. Scoped by assignee for members.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activities retrieved successfully.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Lead is not assigned to current member.
